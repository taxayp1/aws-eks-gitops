apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sportsodds-app
  namespace: sportsodds
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: sportsodds-secrets
    creationPolicy: Owner
  data:
    - secretKey: ODDS_API_KEY
      remoteRef: { key: sportsodds/app, property: odds-api-key }
    - secretKey: BETFAIR_APP_KEY
      remoteRef: { key: sportsodds/app, property: betfair-app-key }
    - secretKey: BETFAIR_USERNAME
      remoteRef: { key: sportsodds/app, property: betfair-username }
    - secretKey: BETFAIR_PASSWORD
      remoteRef: { key: sportsodds/app, property: betfair-password }