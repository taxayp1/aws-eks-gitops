apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sportsodds-db
  namespace: sportsodds
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: sportsodds-pg-app
    creationPolicy: Owner
    template:
      data:
        uri: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}"
  data:
    - secretKey: username
      remoteRef: { key: sportsodds/rds, property: username }
    - secretKey: password
      remoteRef: { key: sportsodds/rds, property: password }
    - secretKey: host
      remoteRef: { key: sportsodds/rds, property: host }
    - secretKey: port
      remoteRef: { key: sportsodds/rds, property: port }
    - secretKey: dbname
      remoteRef: { key: sportsodds/rds, property: dbname }